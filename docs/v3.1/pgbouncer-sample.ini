; PgBouncer config for ProjexCloud production.
; Place at /etc/pgbouncer/pgbouncer.ini on each PgBouncer host.
; One PgBouncer per Postgres cluster (admin, app-0, app-1, vault, payment, ...).

[databases]
; Each routing.pool.primary_endpoint should point at a PgBouncer line.
; Replicas connect direct to the replica Postgres (no PgBouncer in front of
; replicas — they're read-only, latency-sensitive, and connection counts
; are bounded by the small number of read-replica consumers).
projexcloud = host=pg-primary.internal port=5432 dbname=projexcloud

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; ===== Pooling mode =====
; transaction: app-side connections are reused across clients BETWEEN
; transactions. Compatible with our perf defaults — every SDK is careful
; to keep transactions short and never holds session-state between txns.
pool_mode = transaction

; ===== Capacity =====
; max_client_conn  = how many connections all Node pods combined can open
; default_pool_size = how many real Postgres connections PgBouncer holds per (user, db)
; Tune so default_pool_size × users ≤ Postgres max_connections - 20
max_client_conn = 2000
default_pool_size = 25
reserve_pool_size = 5
reserve_pool_timeout = 3
server_lifetime = 3600
server_idle_timeout = 60

; ===== Compatibility =====
; Drop startup parameters that transaction pooling can't preserve across
; checkouts. The app already sets statement_timeout via PoolConfig.options
; on each connect.
ignore_startup_parameters = extra_float_digits,application_name,options

; ===== Health =====
; Used by external load balancers + PG monitoring.
admin_users = pgbouncer_admin
stats_users = pgbouncer_admin

; ===== Logging =====
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
verbose = 0

; ===== Failover hooks (optional) =====
; If using Patroni or Stolon, leave these unset and let the orchestrator
; manage the listening DSN. Manual failover: SIGHUP after editing
; [databases] to point at the new primary.
