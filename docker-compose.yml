# Docker Compose Configuration
# Generated for ProjexCloud
# Database: postgresql

version: '3.8'

services:
  postgres:
    image: postgres:alpine  # Always pulls latest stable PostgreSQL version
    container_name: projexcloud_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-projexcloud_db}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d  # Optional: Add SQL init scripts here
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app_network

  # Redis - route cache, pool pub/sub fanout, meter live counter, identity projection hot store
  redis:
    image: redis:7-alpine
    container_name: projexcloud_redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - app_network

  # Redpanda - Kafka-compatible event streaming for usage.events.v1 + audit fanout
  # Per TechStack-v3.1 §8: simpler ops than vanilla Kafka, no ZooKeeper.
  redpanda:
    image: redpandadata/redpanda:latest
    container_name: projexcloud_redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://localhost:9092
      - --pandaproxy-addr=0.0.0.0:8082
      - --advertise-pandaproxy-addr=localhost:8082
    ports:
      - "${KAFKA_PORT:-9092}:9092"
      - "${KAFKA_ADMIN_PORT:-9644}:9644"
      - "${KAFKA_PROXY_PORT:-8082}:8082"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app_network

  # ClickHouse - usage event rollups (hot, ≤90d) + analytics
  # Per P1-Foundation-Spine §9.3: shared cluster partitioned by pool_index.
  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: projexcloud_clickhouse
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_TCP_PORT:-9000}:9000"
    environment:
      CLICKHOUSE_DB: meter
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./infra/clickhouse/init:/docker-entrypoint-initdb.d
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app_network

  # Verdaccio - private npm registry for @projexlight/* packages (AC-17)
  # Per ProjectStructure-v3.1 §13: scoped to @projexlight/, semver-published.
  verdaccio:
    image: verdaccio/verdaccio:5
    container_name: projexcloud_verdaccio
    ports:
      - "${VERDACCIO_PORT:-4873}:4873"
    volumes:
      - verdaccio_storage:/verdaccio/storage
      - ./infra/verdaccio/conf:/verdaccio/conf
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:4873 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - app_network


  # ProjexLight MCP Server - Code Review Agent & Schema Sync
  # Image pulled from Docker Hub: https://hub.docker.com/r/projexlight/projex-dev-mcp
  mcp-server:
    image: projexlight/projex-dev-mcp:latest
    pull_policy: always  # Always check for latest image on docker-compose up
    container_name: projexcloud_mcp_server
    user: root  # Required for git hooks installation on Windows
    ports:
      - "${MCP_SERVER_PORT:-8766}:8766"  # MCP Server API
    volumes:
      - ./:/workspace  # Project source code (mounted from CLI export)
      - ./.projexlight/feedback:/feedback  # Feedback files (read-write)
      - ./mcp-server/mcp-config.json:/app/mcp-config.json:ro  # Encrypted configuration (inside mcp-server folder)
    env_file:
      - ./mcp-server/.env  # Load environment variables from .env file
    environment:
      # Configuration will be decrypted on startup from mcp-config.json
      - WORKSPACE_PATH=/workspace
      - FEEDBACK_PATH=/feedback
      - MCP_SERVER_PORT=8766
      - MCP_SERVER_HOST=0.0.0.0
      - MCP_CONFIG_FILE=/app/mcp-config.json
      # Note: PROJEXLIGHT_API_URL is loaded from .env file above
      # To change API URL, edit mcp-server/.env file
      # Schema Sync Agent Configuration
      - SCHEMA_SYNC_ENABLED=${SCHEMA_SYNC_ENABLED:-true}
      - SCHEMA_SYNC_INTERVAL=${SCHEMA_SYNC_INTERVAL:-30}
      - AUTO_APPLY_MIGRATIONS=${AUTO_APPLY_MIGRATIONS:-false}
      - DEVELOPER_ID=${DEVELOPER_ID:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8766/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  redpanda_data:
    driver: local
  clickhouse_data:
    driver: local
  verdaccio_storage:
    driver: local

networks:
  app_network:
    driver: bridge

# ============================================
# USAGE INSTRUCTIONS
# ============================================
#
# ⚠️ IMPORTANT: Check for port conflicts first!
# Run this command to check if port 5432 is already in use:
#   Windows: netstat -ano | findstr :5432
#   Mac/Linux: lsof -i :5432
#
# If port is in use (you see output), add "DB_PORT=5433" to your .env file.
#
# 1. Make sure you have Docker and Docker Compose installed
# 2. Copy .env.example to .env and configure your credentials
# 3. (Optional) If port 5432 is in use, edit .env and change:
#    DB_PORT=5432  →  DB_PORT=5433
#    (Use a text editor or sed command to replace, not append)
# 4. Pull the latest database image (recommended before starting):
#    docker-compose pull
#
# 5. Start the database:
#    docker-compose up -d
#
# 6. Stop the database:
#    docker-compose down
#
# 7. Stop and remove all data:
#    docker-compose down -v
#
# 8. View logs:
#    docker-compose logs -f
#
# 9. Check status:
#    docker-compose ps
#
# 10. Update to latest version (while running):
#     docker-compose pull && docker-compose up -d
#
# ============================================
# ACCESSING THE DATABASE
# ============================================
#
# PostgreSQL:
#   Connection string: postgresql://${DB_USER}:${DB_PASSWORD}@localhost:5432/${DB_NAME}
#   CLI access: docker-compose exec postgres psql -U ${DB_USER} -d ${DB_NAME}
#
# ============================================
# INIT SCRIPTS (AUTO-EXECUTED ON FIRST RUN)
# ============================================
#
# 🎉 A database schema init script has been generated for you!
# Location: ./init-scripts/01-create-schema.sql
#
# This script automatically creates tables when the container starts for the first time.
# You can customize it or add more scripts:
#
# - PostgreSQL: .sql or .sh files (executed in alphabetical order)
#   Example: ./init-scripts/01-create-tables.sql
#
# ============================================
# NOTES
# ============================================
#
# - All data is persisted in Docker volumes
# - Environment variables are loaded from .env file
# - Health checks ensure database is ready before app connects
# - Use 'restart: unless-stopped' for automatic recovery
#
# - Init scripts (./init-scripts/*.sql) run ONCE on first container creation
# - To re-run init scripts: docker-compose down -v (⚠️ deletes all data!)
# - For schema changes after setup, use database migrations instead
#
# ============================================
# TROUBLESHOOTING - PORT CONFLICTS
# ============================================
#
# 🚨 Problem: "Port is already allocated" or "Address already in use"
#
# This means port 5432 is being used by another application (often local PostgreSQL/MySQL).
#
# Solution 1: Use a different port (Recommended)
#   1. Edit your .env file and change:
#      DB_PORT=5432  →  DB_PORT=5433
#      (Replace the existing line, don't append)
#   2. Restart: docker-compose down && docker-compose up -d
#   3. Connect using port 5433 instead of 5432
#
# Solution 2: Find and stop the conflicting service
#   Windows:
#     netstat -ano | findstr :5432
#     sc query | findstr postgres
#     sc stop postgresql-x64-17  # Replace with your service name
#   Mac:
#     lsof -i :5432
#     brew services stop postgresql
#   Linux:
#     sudo lsof -i :5432
#     sudo systemctl stop postgresql
#
# Solution 3: Use Docker Desktop to check running containers
#   docker ps -a
#   docker stop <conflicting_container>
#
