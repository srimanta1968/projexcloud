# Voice media plane — TLS front for LiveKit signaling (VA·E1 · TK-4454).
# Install as /etc/nginx/conf.d/<VOICE_PUBLIC_HOST>.conf, replace voice.projexlight.com with
# your host, then `certbot --nginx -d <host>` to add the certificate lines.
#
#   wss://<host>/rtc          browser / widget / voice-runtime signaling  -> livekit :7880
#   https://<host>/twirp/...  LiveKit server API (token-authenticated)    -> livekit :7880
#
# LiveKit listens on 127.0.0.1:7880 only (docker-compose.voice.yml), so this vhost is the
# only way in from outside. Media does not pass through nginx: WebRTC goes to UDP
# 50000-50199 / TCP 7881 (DTLS-SRTP) and SIP to 5060/5061 directly.

map $http_upgrade $voice_connection_upgrade { default upgrade; "" close; }

server {
    server_name voice.projexlight.com;
    listen 443 ssl;
    listen [::]:443 ssl;
    # ssl_certificate / ssl_certificate_key: added by certbot.
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $voice_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Signaling sockets live as long as the call (up to the 2 h drain window).
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name voice.projexlight.com;
    return 301 https://$host$request_uri;
}
