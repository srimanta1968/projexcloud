# ProjexCloud public vhost (reference copy — actual file lives at
# /etc/nginx/conf.d/cloud.projexlight.com.conf on the web host, certbot-managed).
#
#   /            -> static landing page        (/var/www/cloud-landing/index.html)
#   /customers   -> static customers page      (/var/www/cloud-landing/customers.html)
#   /investors   -> static investors page      (/var/www/cloud-landing/investors.html)
#   /workspace   -> tenant-workspace portal    (127.0.0.1:3300)
#   /tenant      -> tenant-admin portal         (127.0.0.1:3200)
#   /console     -> projexcloud-admin portal    (127.0.0.1:3100)
#   everything else (/api/*, /admin/*, /health, /metrics) -> api-gateway (3000)

map $http_upgrade $connection_upgrade { default upgrade; "" close; }

server {
    server_name cloud.projexlight.com;
    client_max_body_size 25m;

    location = / {
        root /var/www/cloud-landing;
        try_files /index.html =404;
    }

    # --- static marketing pages (exact-match wins over the gateway catch-all) ---
    location = /customers { root /var/www/cloud-landing; try_files /customers.html =404; }
    location = /investors { root /var/www/cloud-landing; try_files /investors.html =404; }

    # Landing-page images. REQUIRED, not optional: every other landing rule above is an
    # EXACT match (location = /...), so without this prefix rule /assets/* falls through
    # to `location /` and is proxied to the api-gateway — whose default-deny gate answers
    # {"error":"Unauthorized","details":["Missing bearer token"]} for a JPEG. Same
    # escape-to-the-gateway failure as the portal basePath bug, and it looks like a
    # broken image rather than a routing mistake.
    location ^~ /assets/ {
        root /var/www/cloud-landing;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    location ^~ /workspace { proxy_pass http://127.0.0.1:3300; include /etc/nginx/proxy_common.conf; }

    # The TK-3560 interim IP allowlist that used to guard these two has been
    # REMOVED, and this file now matches what prod actually serves. Its own
    # comment said to drop it "once the auth middleware is deployed and
    # verified" — that shipped, prod dropped it, and this checked-in copy did
    # not, so the file had silently become a rollback to an older policy.
    # Re-applying it 403'd /tenant and /console for everyone but one IP.
    #
    # Access is enforced by the portals' own login plus the gateway's
    # default-deny authGate, not by source IP.
    location ^~ /tenant  { proxy_pass http://127.0.0.1:3200; include /etc/nginx/proxy_common.conf; }
    location ^~ /console { proxy_pass http://127.0.0.1:3100; include /etc/nginx/proxy_common.conf; }

    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_common.conf;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/cloud.projexlight.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/cloud.projexlight.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = cloud.projexlight.com) { return 301 https://$host$request_uri; } # managed by Certbot
    listen 80;
    listen [::]:80;
    server_name cloud.projexlight.com;
    return 404; # managed by Certbot
}
