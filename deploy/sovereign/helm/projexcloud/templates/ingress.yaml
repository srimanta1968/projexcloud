{{- if .Values.ingress.enabled }}
{{- $fullname := include "projexcloud.fullname" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}-gateway
  labels:
    {{- include "projexcloud.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if and .Values.ingress.tls.enabled .Values.ingress.host }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - {{ if .Values.ingress.host }}host: {{ .Values.ingress.host | quote }}
      {{ end }}http:
        paths:
          - path: {{ (index .Values.services "api-gateway" "ingress" "path") | default "/" }}
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-api-gateway
                port:
                  number: {{ (index .Values.services "api-gateway").port }}
{{- end }}
