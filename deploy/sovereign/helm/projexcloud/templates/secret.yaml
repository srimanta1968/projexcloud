{{- /* Skip rendering when the operator supplies an external Secret. */ -}}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "projexcloud.fullname" . }}-secrets
  labels:
    {{- include "projexcloud.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Postgres pool DSNs — injected by `terraform apply` via main.tf set {} blocks.
  ADMIN_POOL_DSN: {{ .Values.adminPoolDsn | quote }}
  APP_POOL_DSN: {{ .Values.appPoolDsn | quote }}
  EVIDENCE_POOL_DSN: {{ .Values.evidencePoolDsn | quote }}
  ADMIN_OPS_TOKEN: {{ .Values.secrets.ADMIN_OPS_TOKEN | quote }}
  JWT_SECRET: {{ .Values.secrets.JWT_SECRET | quote }}
{{- end }}
