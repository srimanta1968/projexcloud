apiVersion: v2
name: projexcloud
description: ProjexCloud platform — sovereign region distribution (P8 Variant B).
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - projexcloud
  - sovereign
  - fedramp
  - il5
  - pipl
  - eu-sovereign
maintainers:
  - name: Projexlight Platform
    email: platform@projexlight.com
icon: https://projexlight.com/icon.png
home: https://projexlight.com/sovereign
sources:
  - https://github.com/projexlight/projexcloud
annotations:
