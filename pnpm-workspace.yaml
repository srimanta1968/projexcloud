packages:
  - 'packages/*'
  - 'services/*'
  - 'tools/*'
  - 'apps/*'
  - 'native/*'
  # The three editor scaffolds in native/ duplicate the package name of the
  # P5 surfaces under packages/. The packages/ versions ship the server.* shape
  # the api-gateway imports; the native/ versions are vestigial stubs from the
  # P2/P3 scaffold (commit 3ffd591). Exclude to break the workspace clash.
  - '!native/hdk-image-editor'
  - '!native/hdk-scanner'
  - '!native/hdk-video-editor'
