version: '3.8'
# Auto-generated PostgreSQL configuration
# Database: projexcloud_db

services:
  postgres:
    # Stable PostGIS 3.6 on PG18 + pgvector (was postgis:18-master, a nightly
    # build that segfaulted under load). Same PG major -> data dir reused as-is.
    build:
      context: .
      dockerfile: postgres.Dockerfile
    image: projexlight/postgres-18-postgis-pgvector:local
    container_name: projexlight-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=projexcloud_db
      - PGDATA=/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - /c/Users/srima/projex_verticals/ProjexCloud/mcp-server/data:/data
      - ../init-scripts:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d projexcloud_db"]
      interval: 10s
      timeout: 5s
      retries: 5
